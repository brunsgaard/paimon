# Builds the Flink (2.2 and 2.3), CDC, Iceberg and bundle jars from this fork and attaches them to a GitHub
# release. Runs on a tag v<pom version>, for example v2.1.0-rc3-brunsgaard.1.
name: Release / fork jars
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+-brunsgaard.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-brunsgaard.[0-9]+"
  workflow_dispatch:
concurrency:
  group: release-fork-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
env:
  PAIMON_FLINKS: "2.2 2.3"
  MODULES: >-
    paimon-flink/paimon-flink-2.2,paimon-flink/paimon-flink-2.3,paimon-flink/paimon-flink-action,paimon-flink/paimon-flink-cdc,paimon-iceberg,paimon-bundle
jobs:
  release:
    if: github.repository == 'brunsgaard/paimon'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: temurin
          cache: maven
      - name: Check that the tag matches the pom version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn -q -ntp -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pom version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests -Dcheckstyle.skip=true -Dspotless.check.skip=true -Drat.skip=true \
            -Pflink2,paimon-iceberg -pl "${MODULES}" -am install
      - name: Collect jars
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for f in ${PAIMON_FLINKS}; do
            cp "paimon-flink/paimon-flink-${f}/target/paimon-flink-${f}-${v}.jar" dist/
          done
          cp "paimon-flink/paimon-flink-action/target/paimon-flink-action-${v}.jar" dist/
          cp "paimon-flink/paimon-flink-cdc/target/paimon-flink-cdc-${v}.jar" dist/
          cp "paimon-iceberg/target/paimon-iceberg-${v}.jar" dist/
          cp "paimon-bundle/target/paimon-bundle-${v}.jar" dist/
          (cd dist && sha256sum -- *.jar > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          base="$(git describe --tags --abbrev=0 --match 'release-*' HEAD)"
          commits="$(git log --format='- %s' "${base}..HEAD" | grep -v '^- \[release\]' || true)"
          notes="$(printf '%s\n\n%s\n' \
            "Apache Paimon ${base} plus the commits below. Built with JDK 11 and the flink2 and paimon-iceberg profiles." \
            "${commits}")"
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${v}" --notes "${notes}" --verify-tag
